map $host $robots_tag {
    default "noindex, nofollow";
    mmjsystems.cl "";
    escuelas.mmjsystems.cl "";
}

server {
    listen 80;
    server_name www.mmjsystems.cl;
    return 308 https://mmjsystems.cl$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    add_header X-Robots-Tag $robots_tag always;

    gzip on;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/xml text/xml image/svg+xml;

    location = /estudios-juridicos {
        return 308 /estudios-juridicos/$is_args$args;
    }

    location = /escuelas {
        return 308 /escuelas/$is_args$args;
    }

    location = /guias/automatizar-correos-y-planillas {
        return 308 /guias/automatizar-correos-y-planillas/$is_args$args;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}

server {
    listen 80;
    server_name escuelas.mmjsystems.cl;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    add_header X-Robots-Tag $robots_tag always;

    gzip on;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/xml text/xml image/svg+xml;

    location = / {
        try_files /escuelas/index.html =404;
    }

    location = /index.html {
        return 308 /;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
